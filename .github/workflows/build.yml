name: Build EXE

on:
  push:
    paths:
      - 'stl_normalizer_gui.py'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install PyInstaller
        run: pip install pyinstaller

      - name: Build with safe flags
        run: |
          pyinstaller ^
            --onefile ^
            --windowed ^
            --noupx ^
            --clean ^
            stl_normalizer_gui.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: STL-Normalizer
          path: dist/stl_normalizer_gui.exe
